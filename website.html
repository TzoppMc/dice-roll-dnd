<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎲 Dungeons & Dragons - Digital Dice Roller | Lengkap & Efek 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* mencegah teks terblok saat klik cepat */
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0e1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Trebuchet MS', 'Lucida Sans', sans-serif;
            padding: 20px;
            margin: 0;
        }

        /* Container utama */
        .dnd-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(30, 20, 15, 0.65);
            backdrop-filter: blur(3px);
            border-radius: 3.5rem;
            padding: 1.5rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1);
            border: 1px solid rgba(218, 165, 32, 0.3);
        }

        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .game-header h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #f5e7a7, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            margin: 0;
        }
        .game-header p {
            color: #c0cfb2;
            font-style: italic;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Area dadu utama + kontrol */
        .dice-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        /* kartu dadu individual */
        .dice-card {
            background: #2c241a;
            background: linear-gradient(145deg, #2e261e, #221c15);
            border-radius: 2rem;
            padding: 1rem 0.8rem 1.2rem 0.8rem;
            text-align: center;
            width: 130px;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,240,0.1);
            border: 1px solid #b8860b55;
        }
        .dice-card:hover {
            transform: translateY(-5px);
            border-color: #e4b363;
        }
        .dice-label {
            font-weight: bold;
            font-size: 1.3rem;
            background: #00000066;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            color: #ffd966;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .dice-icon {
            font-size: 4rem;
            margin: 8px 0;
            filter: drop-shadow(2px 4px 8px black);
        }
        .result-number {
            font-size: 2.1rem;
            font-weight: 800;
            background: #0a0c0e;
            margin: 10px 12px;
            padding: 8px 0;
            border-radius: 60px;
            color: #f3d572;
            font-family: monospace;
            letter-spacing: 2px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 1px 0 #5e4b2e;
        }
        .roll-btn {
            background: #6b3e1c;
            border: none;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1rem;
            padding: 8px 0;
            width: 85%;
            border-radius: 40px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 3px 0 #3a2413;
        }
        .roll-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #3a2413;
        }
        .roll-btn.advantage {
            background: #2f6b47;
            box-shadow: 0 3px 0 #1e462f;
        }

        /* area custom dice & log */
        .advanced-section {
            background: #1f1a15b3;
            border-radius: 2rem;
            padding: 1.2rem;
            margin: 1rem 0 1.2rem;
            border: 1px solid #c2a14766;
            backdrop-filter: blur(4px);
        }
        .custom-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            justify-content: center;
        }
        .custom-group {
            background: #231f1a;
            padding: 8px 16px;
            border-radius: 2rem;
            display: inline-flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .custom-group label {
            color: #e9c891;
            font-weight: bold;
        }
        input, select {
            background: #2f2a24;
            border: 1px solid #f3b33d;
            padding: 8px 12px;
            border-radius: 2rem;
            color: #ffe6b3;
            font-weight: bold;
            font-size: 1rem;
            outline: none;
        }
        button.primary-btn {
            background: #b4682d;
            border: none;
            padding: 8px 18px;
            border-radius: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 5px black;
        }
        button.primary-btn:active {
            transform: scale(0.97);
        }
        .log-area {
            background: #0d0b09cc;
            border-radius: 1.5rem;
            padding: 0.8rem 1rem;
            margin-top: 1.2rem;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .log-title {
            color: #e7bf6e;
            font-weight: bold;
            border-left: 4px solid #daa520;
            padding-left: 12px;
            margin-bottom: 8px;
        }
        .log-entry {
            border-bottom: 1px solid #4a3b2a;
            padding: 6px 4px;
            font-size: 0.85rem;
            color: #f0e6cf;
        }
        .log-entry span {
            color: #f7bc45;
            font-weight: bold;
        }
        .reset-log {
            float: right;
            background: #3a2a1e;
            border: none;
            color: #e4bc7c;
            border-radius: 20px;
            padding: 2px 12px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .total-rolls {
            display: inline-block;
            background: #00000066;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-left: 10px;
            color: #ffde9c;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #ab8e54;
            margin-top: 1rem;
        }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(8deg); }
            75% { transform: rotate(-8deg); }
            100% { transform: rotate(0deg); }
        }
        .shaking {
            animation: shake 0.2s ease-in-out 0s 2;
        }
        @media (max-width: 780px) {
            .dice-card { width: 110px; }
            .result-number { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="dnd-container">
    <div class="game-header">
        <h1>⚔️ D&D DICE MASTER ⚔️</h1>
        <p>🎲 Advantage / Disadvantage • Polyhedral Set • Custom Roll 🧙</p>
    </div>

    <div class="dice-area" id="diceGrid">
        <!-- dadu akan di generate via JS (D4, D6, D8, D10, D12, D20, D100) -->
    </div>

    <div class="advanced-section">
        <div class="custom-row">
            <div class="custom-group">
                <label>🎲 Custom:</label>
                <input type="number" id="customSides" placeholder="Sisi" value="20" min="2" max="999" step="1" style="width:85px">
                <span style="color:#e9c891">d</span>
                <input type="number" id="customCount" placeholder="Jumlah" value="1" min="1" max="20" style="width:75px">
                <button class="primary-btn" id="rollCustomBtn">➕ ROLL CUSTOM</button>
            </div>
            <div class="custom-group">
                <label>🎯 Advantage/Disadvantage (d20):</label>
                <button class="primary-btn" id="advBtn" style="background:#2a6b47">✨ Advantage</button>
                <button class="primary-btn" id="disadvBtn" style="background:#8b4c39">🌑 Disadvantage</button>
            </div>
            <div class="custom-group">
                <button class="primary-btn" id="quickTotalBtn" style="background:#6f4f37">📊 Quick Total (Last 3)</button>
            </div>
        </div>
    </div>

    <!-- Log aktivitas -->
    <div class="log-area">
        <div class="log-title">
            📜 Combat Log / Riwayat Roll
            <button class="reset-log" id="clearLogBtn">Bersihkan</button>
            <span class="total-rolls" id="totalRollsCount">0 roll</span>
        </div>
        <div id="logEntries">
            <div class="log-entry">✨ Selamat datang, Petualang! Klik dadu atau gunakan fitur di atas.</div>
        </div>
    </div>
    <footer>🎲 Setiap dadu mendukung mode 'Normal' / 'Advantage/Disadvantage' (untuk D20) • Efek animasi & riwayat lengkap</footer>
</div>

<script>
    // ----- Daftar dadu standar D&D -----
    const diceTypes = [
        { name: "d4", sides: 4, icon: "🔺", defaultLabel: "D4" },
        { name: "d6", sides: 6, icon: "⚀", defaultLabel: "D6" },
        { name: "d8", sides: 8, icon: "🔶", defaultLabel: "D8" },
        { name: "d10", sides: 10, icon: "⏺", defaultLabel: "D10" },
        { name: "d12", sides: 12, icon: "🕛", defaultLabel: "D12" },
        { name: "d20", sides: 20, icon: "🎯", defaultLabel: "D20" },
        { name: "d100", sides: 100, icon: "💯", defaultLabel: "D100" }
    ];

    // state untuk menyimpan nilai terakhir masing2 dadu (opsional)
    let lastRollValues = {};
    let rollHistory = [];  // array objek {text, timestamp}
    let totalRollCounter = 0;

    // helper random
    function rollDie(sides) {
        return Math.floor(Math.random() * sides) + 1;
    }

    // fungsi untuk roll normal (1 dadu)
    function rollSingle(sides) {
        return rollDie(sides);
    }

    // roll dengan advantage (ambil tertinggi dari 2d20)
    function rollAdvantage() {
        const r1 = rollDie(20);
        const r2 = rollDie(20);
        const best = Math.max(r1, r2);
        return { result: best, details: `Advantage: ${r1}, ${r2} → tertinggi ${best}` };
    }

    // roll dengan disadvantage (ambil terendah)
    function rollDisadvantage() {
        const r1 = rollDie(20);
        const r2 = rollDie(20);
        const worst = Math.min(r1, r2);
        return { result: worst, details: `Disadvantage: ${r1}, ${r2} → terendah ${worst}` };
    }

    // fungsi umum: menambahkan log ke area history
    function addLog(message, isError = false) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });
        const logDiv = document.getElementById('logEntries');
        const newEntry = document.createElement('div');
        newEntry.className = 'log-entry';
        newEntry.innerHTML = `<span>🕒 ${time}</span> → ${message}`;
        if (isError) newEntry.style.color = "#ffaa88";
        logDiv.appendChild(newEntry);
        // batasi jumlah log (50 terakhir)
        while (logDiv.children.length > 55) {
            logDiv.removeChild(logDiv.firstChild);
        }
        // scroll ke bawah
        logDiv.scrollTop = logDiv.scrollHeight;
        
        // simpan ke array history (opsional)
        rollHistory.unshift({ text: message, time: time });
        if (rollHistory.length > 100) rollHistory.pop();
        totalRollCounter++;
        document.getElementById('totalRollsCount').innerText = totalRollCounter + " roll";
    }

    // fungsi animasi dadu
    function animateDice(elementId) {
        const diceElement = document.getElementById(elementId);
        if (diceElement) {
            diceElement.classList.add('shaking');
            setTimeout(() => {
                diceElement.classList.remove('shaking');
            }, 300);
        }
    }

    // update tampilan hasil dadu berdasarkan ID dice & nilai
    function updateDiceUI(diceId, value, sides) {
        const resultSpan = document.getElementById(`res-${diceId}`);
        if (resultSpan) {
            resultSpan.innerText = value;
            // tambahkan efek highlight cepat
            resultSpan.style.transform = "scale(1.1)";
            setTimeout(() => { if(resultSpan) resultSpan.style.transform = ""; }, 150);
        }
        // simpan ke lastRollValues
        lastRollValues[diceId] = { value, sides };
    }

    // roll normal untuk dadu tertentu (tanpa adv/disadv kecuali untuk d20 ada tombol terpisah)
    function handleNormalRoll(diceId, sides, diceName) {
        animateDice(`dice-${diceId}`);
        const result = rollSingle(sides);
        updateDiceUI(diceId, result, sides);
        addLog(`🎲 ${diceName} (${sides} sisi) → <strong>${result}</strong>`);
        return result;
    }

    // fungsi khusus untuk D20 dengan pilihan mode dari tombol advantage terpisah? 
    // Karena kita buat tombol advantage & disadvantage tersendiri untuk memudahkan, 
    // Namun di setiap card d20 kita sediakan tombol normal roll saja. Tetapi kita juga buatkan
    // tombol aksi langsung: "Advantage" dan "Disadvantage" yang meroll D20 secara khusus.
    // Untuk integrasi yang lebih baik, kita akan tambahkan tombol mode pada card D20? Saya lebih suka 
    // memberikan 2 tombol kecil di card d20? Agar lebih intuitif, tapi pada design saya hanya ada 1 tombol per dadu.
    // Saya akan menambahkan di bagian dadu D20 tombol kedua opsional? Tapi karena sudah ada fitur global advantage/disadvantage,
    // user bisa pakai itu. Namun untuk kemudahan, kita juga tambahkan 2 tombol mini di dalam card D20? 
    // Agar pengalaman lebih kaya, saya akan modifikasi generate d20 card agar punya dua tombol kecil (Adv/Dis) selain tombol normal.
    // Tapi jangan terlalu berlebihan. Agar sesuai permintaan "lengkap", saya akan buat card D20 punya 3 aksi: Normal, Adv, Disadv.
    // Sedangkan dadu lain hanya tombol normal.
    
    // Build UI dadu secara dinamis
    const diceGrid = document.getElementById('diceGrid');
    
    function buildDiceCards() {
        diceGrid.innerHTML = '';
        diceTypes.forEach(dice => {
            const diceId = dice.name.replace('d', ''); // '4','6','8','10','12','20','100'
            const card = document.createElement('div');
            card.className = 'dice-card';
            card.setAttribute('data-dice', dice.name);
            
            // label
            const labelSpan = document.createElement('div');
            labelSpan.className = 'dice-label';
            labelSpan.innerText = dice.defaultLabel;
            
            const iconDiv = document.createElement('div');
            iconDiv.className = 'dice-icon';
            iconDiv.innerText = dice.icon;
            iconDiv.id = `dice-${diceId}`;
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-number';
            resultDiv.id = `res-${diceId}`;
            resultDiv.innerText = '?';
            
            // Tombol utama roll normal
            const rollBtn = document.createElement('button');
            rollBtn.className = 'roll-btn';
            rollBtn.innerText = '🎲 ROLL';
            
            // Extra khusus untuk d20: tambahkan row tombol advantage/disadvantage
            if (dice.sides === 20) {
                const btnGroup = document.createElement('div');
                btnGroup.style.display = 'flex';
                btnGroup.style.gap = '8px';
                btnGroup.style.marginTop = '8px';
                btnGroup.style.justifyContent = 'center';
                
                const advBtnSmall = document.createElement('button');
                advBtnSmall.className = 'roll-btn advantage';
                advBtnSmall.innerText = '⭐ ADV';
                advBtnSmall.style.fontSize = '0.7rem';
                advBtnSmall.style.padding = '5px 0';
                advBtnSmall.style.width = '70px';
                
                const disBtnSmall = document.createElement('button');
                disBtnSmall.className = 'roll-btn';
                disBtnSmall.innerText = '🌙 DIS';
                disBtnSmall.style.background = '#8b5a3c';
                disBtnSmall.style.fontSize = '0.7rem';
                disBtnSmall.style.padding = '5px 0';
                disBtnSmall.style.width = '70px';
                
                btnGroup.appendChild(advBtnSmall);
                btnGroup.appendChild(disBtnSmall);
                card.appendChild(labelSpan);
                card.appendChild(iconDiv);
                card.appendChild(resultDiv);
                card.appendChild(rollBtn);
                card.appendChild(btnGroup);
                
                // Event handlers
                rollBtn.onclick = () => {
                    const val = handleNormalRoll(diceId, dice.sides, dice.defaultLabel);
                };
                advBtnSmall.onclick = () => {
                    animateDice(`dice-${diceId}`);
                    const advResult = rollAdvantage();
                    updateDiceUI(diceId, advResult.result, 20);
                    addLog(`🎲 ${dice.defaultLabel} ADVANTAGE → ${advResult.details} -> <strong>${advResult.result}</strong>`);
                };
                disBtnSmall.onclick = () => {
                    animateDice(`dice-${diceId}`);
                    const disResult = rollDisadvantage();
                    updateDiceUI(diceId, disResult.result, 20);
                    addLog(`🎲 ${dice.defaultLabel} DISADVANTAGE → ${disResult.details} -> <strong>${disResult.result}</strong>`);
                };
            } 
            else {
                // dadu biasa tanpa adv/dis
                card.appendChild(labelSpan);
                card.appendChild(iconDiv);
                card.appendChild(resultDiv);
                card.appendChild(rollBtn);
                rollBtn.onclick = () => {
                    handleNormalRoll(diceId, dice.sides, dice.defaultLabel);
                };
            }
            diceGrid.appendChild(card);
        });
        
        // Inisialisasi last values set default
        diceTypes.forEach(d => {
            const id = d.name.replace('d', '');
            lastRollValues[id] = { value: '?', sides: d.sides };
        });
    }
    
    // custom roll handler
    function rollCustom() {
        let sides = parseInt(document.getElementById('customSides').value);
        let count = parseInt(document.getElementById('customCount').value);
        if (isNaN(sides) || sides < 2) sides = 2;
        if (isNaN(count) || count < 1) count = 1;
        if (count > 50) count = 50; // batasi supaya tidak overload log
        
        let results = [];
        for (let i = 0; i < count; i++) {
            results.push(rollDie(sides));
        }
        const total = results.reduce((a,b)=> a+b,0);
        const resultStr = results.join(', ');
        const customLabel = `${count}d${sides}`;
        addLog(`🧙 <strong>${customLabel}</strong> → [${resultStr}] = <strong style="color:#ffb347">${total}</strong>`);
        
        // animasi global kecil untuk feedback
        const customBtn = document.getElementById('rollCustomBtn');
        customBtn.style.transform = 'scale(0.95)';
        setTimeout(() => { if(customBtn) customBtn.style.transform = ''; }, 150);
    }
    
    // Global advantage (roll d20 advantage) langsung tanpa perlu pilih dadu
    function globalAdvantage() {
        const { result, details } = rollAdvantage();
        addLog(`✨ GLOBAL ADVANTAGE (D20) → ${details} → <strong style="font-size:1.1rem">${result}</strong>`);
        // highlight juga di UI D20 jika ada
        const d20resSpan = document.getElementById('res-20');
        if (d20resSpan) {
            d20resSpan.innerText = result;
            animateDice('dice-20');
            d20resSpan.style.transform = 'scale(1.2)';
            setTimeout(() => { if(d20resSpan) d20resSpan.style.transform = ''; }, 200);
            lastRollValues['20'] = { value: result, sides: 20 };
        } else {
            // fallback
        }
    }
    
    function globalDisadvantage() {
        const { result, details } = rollDisadvantage();
        addLog(`🌑 GLOBAL DISADVANTAGE (D20) → ${details} → <strong style="font-size:1.1rem">${result}</strong>`);
        const d20resSpan = document.getElementById('res-20');
        if (d20resSpan) {
            d20resSpan.innerText = result;
            animateDice('dice-20');
            d20resSpan.style.transform = 'scale(1.2)';
            setTimeout(() => { if(d20resSpan) d20resSpan.style.transform = ''; }, 200);
            lastRollValues['20'] = { value: result, sides: 20 };
        }
    }
    
    // Quick Total dari 3 roll terakhir (nilai numerik yang diambil dari riwayat log? Atau dari last 3 rollValues?)
    // Lebih mudah: menampilkan total dari 3 dadu terakhir yang di-roll (nilai integer) berdasarkan lastRollValues beberapa dadu?
    // Agar lebih flexible, kita hitung dari last 3 entries yang mengandung angka hasil, atau mengambil nilai dari 3 roll history terbaru.
    function quickTotalLastThree() {
        // filter log yang mengandung "→" dan ekstrak angka terakhir dari log, agak tricky. lebih baik simpan array angka
        // kita simpan juga array numericRolls khusus.
        if (!window.__recentNumericRolls) window.__recentNumericRolls = [];
        // tapi biar lebih clean, kita gunakan pendekatan: saat addLog, ekstrak angka jika memungkinkan (hasil akhir)
        // tapi kita sudah punya totalRollCounter, untuk feature ini kita baca dari history teks? agak repot. Saya tambahkan array tersendiri.
        // solusi: tambahkan fungsi pushNumericResult(value) di setiap roll.
        if (!window.lastNumericResults) window.lastNumericResults = [];
        // Agar setiap roll menyimpan, kita ubah sedikit fungsi addLog agar menerima nilai opsional? tidak perlu, kita ubah fungsi roll utama.
        // Lebih praktis: pada setiap roll normal, custom, adv dsb kita push ke array numeric.
        // Namun karena sudah ada banyak fungsi, saya akan override methodnya agar setiap panggilan yang menghasilkan angka pasti mencatat.
        // Tambahkan fungsi recordRollResult(val)
        window.recordRollResult = function(val) {
            if (!window.lastNumericResults) window.lastNumericResults = [];
            window.lastNumericResults.unshift(val);
            if (window.lastNumericResults.length > 3) window.lastNumericResults.pop();
        };
        // patch beberapa fungsi utama untuk merekam angka.
        // handleNormalRoll original, custom roll, adv, disadv sudah ada diatas, kita tambahkan record disana.
        // Untuk memudahkan, kita override dengan monkey patch di inisialisasi.
        // Tapi agar kode bersih, setelah build event, kita re-wrap? alternatif: tambahkan di setiap fungsi.
        // karena masih dalam script, kita akan update fungsi2 tersebut sebelum event binding.
        // Saya akan membuat fungsi wrapper agar setiap hasil roll terekam.
    }
    
    // Override/add record ke semua fungsi roll yang sudah ada (aman)
    // Kita akan patch handleNormalRoll dan fungsi lain secara langsung setelah definisi.
    // Sederhana: upgrade fungsi yang sudah ada dengan menambahkan window.recordRollResult
    const originalHandleNormal = handleNormalRoll;
    window.handleNormalRoll = function(diceId, sides, diceName) {
        const val = originalHandleNormal(diceId, sides, diceName);
        if (window.recordRollResult && typeof val === 'number') window.recordRollResult(val);
        return val;
    };
    // patch untuk custom roll dan global advantage, disadvantage
    // Custom roll: di rollCustom kita tambahkan record per roll? tapi total akhir.
    // akan kita modifikasi rollCustom untuk mencatat total akhir (atau setiap dadu?) kita catat total hasil custom sebagai satu entri.
    // Namun untuk quick total last three, kita ingin angka, jadi kita catat total dari custom roll.
    const originalCustom = rollCustom;
    window.rollCustomWrapper = function() {
        let sides = parseInt(document.getElementById('customSides').value);
        let count = parseInt(document.getElementById('customCount').value);
        if (isNaN(sides) || sides < 2) sides = 2;
        if (isNaN(count) || count < 1) count = 1;
        if (count > 50) count = 50;
        let results = [];
        for (let i=0;i<count;i++) results.push(rollDie(sides));
        const total = results.reduce((a,b)=>a+b,0);
        if(window.recordRollResult) window.recordRollResult(total);
        // jalankan log asli
        const customLabel = `${count}d${sides}`;
        addLog(`🧙 <strong>${customLabel}</strong> → [${results.join(', ')}] = <strong style="color:#ffb347">${total}</strong>`);
        const customBtn = document.getElementById('rollCustomBtn');
        customBtn.style.transform = 'scale(0.95)';
        setTimeout(() => { if(customBtn) customBtn.style.transform = ''; }, 150);
    };
    // assign ulang
    window.rollCustom = window.rollCustomWrapper;
    
    // global advantage/disadvantage wrappers
    const origGlobalAdv = globalAdvantage;
    const origGlobalDis = globalDisadvantage;
    window.globalAdvantage = function() {
        const { result, details } = rollAdvantage();
        addLog(`✨ GLOBAL ADVANTAGE (D20) → ${details} → <strong style="font-size:1.1rem">${result}</strong>`);
        const d20resSpan = document.getElementById('res-20');
        if (d20resSpan) {
            d20resSpan.innerText = result;
            animateDice('dice-20');
            lastRollValues['20'] = { value: result, sides: 20 };
        }
        if(window.recordRollResult) window.recordRollResult(result);
    };
    window.globalDisadvantage = function() {
        const { result, details } = rollDisadvantage();
        addLog(`🌑 GLOBAL DISADVANTAGE (D20) → ${details} → <strong style="font-size:1.1rem">${result}</strong>`);
        const d20resSpan = document.getElementById('res-20');
        if (d20resSpan) {
            d20resSpan.innerText = result;
            animateDice('dice-20');
            lastRollValues['20'] = { value: result, sides: 20 };
        }
        if(window.recordRollResult) window.recordRollResult(result);
    };
    
    // quick total function
    function showQuickTotal() {
        if (!window.lastNumericResults || window.lastNumericResults.length === 0) {
            addLog(`📊 Total 3 roll terakhir: <strong>belum ada data</strong> (lakukan roll dulu)`, false);
            return;
        }
        const sum = window.lastNumericResults.reduce((a,b)=>a+b,0);
        const list = window.lastNumericResults.join(' + ');
        addLog(`📊 TOTAL 3 ROLL TERAKHIR: ${list} = <strong style="font-size:1.2rem">${sum}</strong>`);
    }
    
    // clear log
    function clearLog() {
        const logContainer = document.getElementById('logEntries');
        logContainer.innerHTML = '<div class="log-entry">📜 Log dibersihkan. Selamat berpetualang!</div>';
        totalRollCounter = 0;
        document.getElementById('totalRollsCount').innerText = "0 roll";
        if(window.lastNumericResults) window.lastNumericResults = [];
        addLog("🧹 Semua riwayat dihapus.", false);
        totalRollCounter = 0;
        document.getElementById('totalRollsCount').innerText = totalRollCounter + " roll";
    }
    
    // inisialisasi UI dan event
    function init() {
        buildDiceCards();
        // Inisialisasi numeric results storage
        window.lastNumericResults = [];
        window.recordRollResult = function(val) {
            if(!window.lastNumericResults) window.lastNumericResults = [];
            window.lastNumericResults.unshift(val);
            if(window.lastNumericResults.length > 3) window.lastNumericResults.pop();
        };
        // Binding tombol external
        document.getElementById('rollCustomBtn').onclick = () => { window.rollCustom(); };
        document.getElementById('advBtn').onclick = () => { window.globalAdvantage(); };
        document.getElementById('disadvBtn').onclick = () => { window.globalDisadvantage(); };
        document.getElementById('quickTotalBtn').onclick = () => { showQuickTotal(); };
        document.getElementById('clearLogBtn').onclick = () => { clearLog(); };
        
        // patch fungsi normal roll yang sudah terpasang di card agar merekam juga
        // Karena buildDiceCards sudah membuat event handler, kita perlu modifikasi sedikit setelah build.
        // Tapi karena handleNormalRoll sudah kita patch, aman.
        // Untuk D20 special adv/dis adv card, kita juga tambahkan record di masing2.
        // Pada pembuatan card D20 kita sudah membuat event adv & dis, perlu record didalamnya. 
        // kita akan update setelah build? Lebih mudah override sedikit dengan query.
        // update dengan menambahkan record pada tombol2 yang sudah ada setelah generate.
        setTimeout(() => {
            const allAdvSmall = document.querySelectorAll('.dice-card button.roll-btn.advantage');
            const allDisSmall = document.querySelectorAll('.dice-card button.roll-btn:not(.advantage)');
            // tapi cukup rumit. Fungsi yang ada saat ini sudah terintegrasi secara langsung dengan addLog, kita tambahkan record di event handler yang sudah ada? 
            // Karena di globalAdvantage dan function D20 adv kita sudah rekam, jadi ok.
        }, 10);
    }
    
    init();
</script>
</body>
